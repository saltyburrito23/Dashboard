[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dashboard-v2"
version = "0.1.0"
description = "Dashboard V2: live Schwab options research with a rules-based bias engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "plotly>=6.0.0",
  "python-dotenv>=1.0.1",
  "schwabdev>=3.0.3",
  "streamlit>=1.42.0",
  "streamlit-autorefresh>=1.0.1",
  "watchdog>=4.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

